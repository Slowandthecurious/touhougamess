<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>My Game</title>
</head>
<body>
  <canvas id="canvas" style="width: 50%; height: 50%; display: block; margin: 0 auto;" />
  <script type="text/javascript" src="es6-promise.js"></script>
  <script type="text/javascript" src="browserfs.min.js"></script>
  <script type="text/javascript" src="loader.js"></script>
  <script type="text/javascript">
    var emulator = new Emulator(document.querySelector("#canvas"),
      null,
      new DosBoxLoader(
        DosBoxLoader.emulatorJS("dosbox.js"),
        DosBoxLoader.nativeResolution(640, 400),
        DosBoxLoader.mountZip("c",
          DosBoxLoader.fetchFile("Game Files", "th02e.hdi")),
        DosBoxLoader.startExe("th02e.hdi")
      ));
    emulator.start({ waitAfterDownloading: true });
  </script>
</body>
</html>
